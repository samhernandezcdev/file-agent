[project]
name = "file-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "samhernandezc.dev@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "typer>=0.27.1",
]

[project.scripts]
file-agent = "file_agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
